# Grafana Data Source Configuration for Prometheus (Épic 8)
# Version: 0.4.2

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "15s"
      queryTimeout: "30s"
    secureJsonData:
      # Pas de credentials nécessaires pour Prometheus local
    version: 1
