name: Test Pull Request

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test PR
    runs-on: ubuntu-latest
    
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Black formatting check
        run: black --check backend/ tests/

      - name: Run isort sorting check
        run: isort --check-only backend/ tests/

      - name: Run flake8 linting
        run: flake8 backend/ tests/ --max-line-length=88 --extend-ignore=E203

      - name: Run mypy type checking
        run: mypy backend/ tests/ --ignore-missing-imports

      - name: Run all tests with coverage
        run: |
          pytest tests/ -v --cov=backend --cov-report=xml --cov-report=html --cov-fail-under=90

      - name: Comment coverage on PR
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          coverage-file: coverage.xml
          github-token: ${{ secrets.GITHUB_TOKEN }}
