name: Agent World CI/CD

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.11'
  POETRY_VERSION: '1.7.0'

jobs:
  # Job de linting et vérification de la qualité du code
  lint-and-quality:
    name: Lint and Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Black formatting check
        run: |
          black --check backend/ tests/

      - name: Run isort sorting check
        run: |
          isort --check-only backend/ tests/

      - name: Run flake8 linting
        run: |
          flake8 backend/ tests/ --max-line-length=88 --extend-ignore=E203

      - name: Run mypy type checking
        run: |
          mypy backend/ tests/ --ignore-missing-imports

  # Job de tests unitaires
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-quality
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: agent_world
          POSTGRES_PASSWORD: agent_world
          POSTGRES_DB: agent_world_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready -U agent_world --health-interval 10s --health-timeout 5s --health-retries 5
    
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql://agent_world:agent_world@localhost:5432/agent_world_test
        run: |
          pytest tests/unit/ -v --cov=backend --cov-report=xml --cov-report=html -x

      - name: Upload coverage report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/

  # Job de tests d'intégration
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: agent_world
          POSTGRES_PASSWORD: agent_world
          POSTGRES_DB: agent_world_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready -U agent_world --health-interval 10s --health-timeout 5s --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://agent_world:agent_world@localhost:5432/agent_world_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest tests/integration/ -v --cov=backend --cov-report=xml --cov-report=html -x

  # Job de build et déploiement (pour la branche main uniquement)
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: [lint-and-quality, unit-tests, integration-tests]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Docker image
        run: |
          docker build -t agent-world:latest .

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name != 'pull_request'
        run: |
          docker tag agent-world:latest ${{ secrets.DOCKER_HUB_USERNAME }}/agent-world:latest
          docker tag agent-world:latest ${{ secrets.DOCKER_HUB_USERNAME }}/agent-world:${{ github.sha }}
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/agent-world:latest
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/agent-world:${{ github.sha }}

  # Job de création d'une release (pour les tags uniquement)
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to PyPI
        if: github.event_name != 'pull_request'
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel twine
          python setup.py sdist bdist_wheel
          twine upload dist/* -u __token__ -p ${{ secrets.PYPI_API_TOKEN }}
