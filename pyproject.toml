[build-system]
requires = ["setuptools>=69.0.0", "wheel>=0.42.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-world"
version = "0.1.0"
description = "Plateforme open-source pour créer, gérer et déployer des agents IA"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Jeremy Goupil", email = "goupiljeremy@gmail.com"}
]
keywords = ["ai", "agents", "llm", "mistral", "openai", "api", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "Flask>=3.0.0",
    "Flask-RESTful>=0.3.10",
    "Flask-CORS>=4.0.0",
    "Flask-SQLAlchemy>=3.1.1",
    "python-dotenv>=1.0.0",
    "SQLAlchemy>=2.0.25",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.1",
    "requests>=2.31.0",
    "httpx>=0.26.0",
    "pyjwt>=2.8.0",
    "passlib>=1.7.4",
    "redis>=5.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-flask>=1.3.0",
    "factory-boy>=3.3.0",
    "black>=24.1.1",
    "flake8>=6.1.0",
    "isort>=5.13.2",
    "mypy>=1.8.0",
    "coverage>=7.4.0",
]
docs = [
    "mkdocs>=1.5.3",
    "mkdocs-material>=9.5.6",
]

[project.scripts]
agent = "backend.cli:main"

[project.urls]
Homepage = "https://github.com/GoupilJeremy/agent-world"
Documentation = "https://github.com/GoupilJeremy/agent-world#readme"
Repository = "https://github.com/GoupilJeremy/agent-world.git"
Issues = "https://github.com/GoupilJeremy/agent-world/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_world*", "backend*", "tests*"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["agent_world", "backend", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --cov=backend --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = ["backend"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
