# Redis Service for Agent World
# Version: 0.4.3 (Épic 8 - Sprint 6)
# Description: Service exposant Redis pour le cache

apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: agent-world
  labels:
    app: redis
    component: cache
    version: "7.0"
    epic: "8"
spec:
  selector:
    app: redis
    component: cache
  
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
  
  # Type ClusterIP pour un accès interne au cluster
  type: ClusterIP
  
  # Session affinity non nécessaire pour Redis
  sessionAffinity: None

---
# Service pour Redis Exporter (optionnel)
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
  namespace: agent-world
  labels:
    app: redis-exporter
    component: monitoring
spec:
  selector:
    app: redis-exporter
  ports:
    - name: metrics
      port: 9121
      targetPort: 9121
      protocol: TCP
  type: ClusterIP
